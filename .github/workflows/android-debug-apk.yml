      - name: Prepare web assets for Capacitor
        working-directory: My_Space_Phase_6_Real_Backend_Integration
        run: |
          mkdir -p www
          for f in index.html app.js styles.css phase6-ui.js phase6-ui.css supabase-config.js supabase-bridge.js social-bridge.js wafi-bridge.js media-bridge.js social-plus-bridge.js cloud-features-bridge.js manifest.webmanifest sw.js _headers; do
            if [ -f "$f" ]; then cp "$f" www/; fi
          done
          if [ -d icons ]; then cp -R icons www/icons; fi
          python3 - <<'PY'
          import json
          p = "capacitor.config.json"
          with open(p) as f:
              config = json.load(f)
          config["webDir"] = "www"
          with open(p, "w") as f:
              json.dump(config, f, indent=2)
          PY
